<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Holi Orders</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff6f61, #ffcc00, #00cc99, #3399ff, #cc33ff);
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      max-width: 1000px;
      margin: 0 auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      padding: 10px;
      border: 1px solid #fff;
    }
    th {
      background: #ff6f61;
    }
    button {
      padding: 4px 8px;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      margin-top: 10px;
      font-size: 12px;
    }
    .deliver-btn { background: #00cc99; }
    .deliver-btn:hover:not(:disabled) { background: #009973; }
    .spam-btn { background: #ff4a3d; }
    .spam-btn:hover:not(:disabled) { background: #cc392f; }
    button:disabled { background: #666; cursor: not-allowed; }
    .delivered-yes { color: #00cc99; }
    .delivered-no { color: #ff4a3d; }
    .spam-yes { color: #ff4a3d; }
    .spam-no { color: #00cc99; }
    #message { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Holi Orders</h1>
    <table id="ordersTable">
      <thead>
        <tr>
          <th>Order ID</th> 
          <th>Name</th>
          <th>Quantity</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Order Date</th>
          <th>Delivered</th>
          <th>Spam</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
    <p id="message"></p>
  </div>

  <script>
    async function fetchOrders() {
      try {
        const response = await fetch('/api/orders');
        const orders = await response.json();
        if (!response.ok) throw new Error(orders.error || 'Failed to fetch orders.');

        const tbody = document.getElementById('ordersBody');
        tbody.innerHTML = '';

        orders.forEach(order => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${order.orderId}</td>
            <td>${order.name}</td>
            <td>${order.quantity}</td>
            <td>${order.phone}</td>
            <td>${order.address}</td>
            <td>${new Date(order.orderDate).toLocaleString()}</td>
            <td class="${order.delivered ? 'delivered-yes' : 'delivered-no'}">${order.delivered ? 'Yes' : 'No'}</td>
            <td class="${order.spam ? 'spam-yes' : 'spam-no'}">${order.spam ? 'Yes' : 'No'}</td>
            <td>
              <button class="deliver-btn" onclick="updateStatus('${order.orderId}', 'deliver')" ${order.delivered || order.spam ? 'disabled' : ''}>Delivered</button>
              <button class="spam-btn" onclick="updateStatus('${order.orderId}', 'spam')" ${order.spam || order.delivered ? 'disabled' : ''}>Spam</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        document.getElementById('message').textContent = error.message;
      }
    }
    async function updateStatus(orderId, action) {
      await fetch(`/api/orders/${orderId}/${action}`, { method: 'PUT' });
      fetchOrders();
    }
    window.onload = fetchOrders;
  </script>
</body>
</html>
