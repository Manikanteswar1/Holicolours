<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Holi Orders</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff6f61, #ffcc00, #00cc99, #3399ff, #cc33ff);
      background-size: cover;
      color: white;
      text-align: center;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      max-width: 1000px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 20px;
    }

    /* Summary Styles */
    .summary {
      display: flex;
      justify-content: space-between; /* Arrange items side by side */
      margin-bottom: 20px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      flex-wrap: wrap; /* Wrap items on smaller screens */
      gap: 10px; /* Add spacing between items */
    }

    .summary div {
      flex: 1; /* Equal width for all items */
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
      text-align: center;
      min-width: 150px; /* Minimum width for each item */
    }

    .summary .delivered {
      color: #00cc99;
    }

    .summary .spam {
      color: #ff4a3d;
    }

    .summary .pending {
      color: #ffcc00;
    }

    .summary .total-combos {
      color: #3399ff;
    }

    /* Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 12px;
      border: 1px solid #fff;
    }

    th {
      background: #ff6f61;
      font-weight: bold;
    }

    tr:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Button Styles */
    button {
      padding: 6px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin: 4px;
      font-size: 14px;
      transition: background 0.3s ease;
    }

    .deliver-btn {
      background: linear-gradient(135deg, #00cc99, #009973);
      color: white;
    }

    .deliver-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #009973, #007a5c);
    }

    .spam-btn {
      background: linear-gradient(135deg, #ff4a3d, #cc392f);
      color: white;
    }

    .spam-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #cc392f, #a82f26);
    }

    button:disabled {
      background: #666;
      cursor: not-allowed;
    }

    /* Status Styles */
    .delivered-yes { color: #00cc99; }
    .delivered-no { color: #ff4a3d; }
    .spam-yes { color: #ff4a3d; }
    .spam-no { color: #00cc99; }

    /* Message Styles */
    #message {
      margin-top: 20px;
      font-weight: bold;
      color: #ff4a3d;
    }

    /* Loading Spinner */
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #ff6f61;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Responsive Table */
    @media (max-width: 768px) {
      table {
        display: block;
        overflow-x: auto;
        white-space: nowrap;
      }

      .summary {
        flex-direction: column; /* Stack vertically on small screens */
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Holi Orders</h1>

    <!-- Summary Section -->
    <div class="summary">
      <div class="delivered">Delivered: <span id="deliveredCount">0</span></div>
      <div class="spam">Spam: <span id="spamCount">0</span></div>
      <div class="pending">Pending: <span id="pendingCount">0</span></div>
      <div class="total-combos">Total Combos Delivered: <span id="totalCombosCount">0</span></div>
    </div>

    <!-- Orders Table -->
    <table id="ordersTable">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Name</th>
          <th>Quantity</th>
          <th>Phone</th>
          <th>Address</th>
          <th>Actions</th>
          <th>Delivered</th>
          <th>Spam</th>
          <th>Order Date</th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr>
          <td colspan="9">
            <div class="loader"></div>
          </td>
        </tr>
      </tbody>
    </table>
    <p id="message"></p>
  </div>

  <script>
    // Fetch and display orders
    async function fetchOrders() {
      const tbody = document.getElementById('ordersBody');
      const message = document.getElementById('message');
      tbody.innerHTML = '<tr><td colspan="9"><div class="loader"></div></td></tr>'; // Show loading spinner

      try {
        const response = await fetch('/api/orders');
        if (!response.ok) throw new Error('Failed to fetch orders.');

        const orders = await response.json();
        tbody.innerHTML = ''; // Clear loading spinner

        if (orders.length === 0) {
          tbody.innerHTML = '<tr><td colspan="9">No orders found.</td></tr>';
          return;
        }

        // Counters for summary
        let deliveredCount = 0;
        let spamCount = 0;
        let pendingCount = 0;
        let totalCombosCount = 0;

        // Populate table with orders
        orders.forEach(order => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${order.orderId}</td>
            <td>${order.name}</td>
            <td>${order.quantity}</td>
            <td>${order.phone}</td>
            <td>${order.address}</td>
            <td>
              <button class="deliver-btn" onclick="updateStatus('${order.orderId}', 'deliver')" ${order.delivered || order.spam ? 'disabled' : ''}>Delivered</button>
              <button class="spam-btn" onclick="updateStatus('${order.orderId}', 'spam')" ${order.spam || order.delivered ? 'disabled' : ''}>Spam</button>
            </td>
            <td class="${order.delivered ? 'delivered-yes' : 'delivered-no'}">${order.delivered ? 'Yes' : 'No'}</td>
            <td class="${order.spam ? 'spam-yes' : 'spam-no'}">${order.spam ? 'Yes' : 'No'}</td>
            <td>${new Date(order.orderDate).toLocaleString()}</td>
          `;
          tbody.appendChild(row);

          // Update counters
          if (order.delivered) {
            deliveredCount++;
            totalCombosCount += parseInt(order.quantity); // Add quantity to total combos
          } else if (order.spam) {
            spamCount++;
          } else {
            pendingCount++;
          }
        });

        // Update summary
        document.getElementById('deliveredCount').textContent = deliveredCount;
        document.getElementById('spamCount').textContent = spamCount;
        document.getElementById('pendingCount').textContent = pendingCount;
        document.getElementById('totalCombosCount').textContent = totalCombosCount;
      } catch (error) {
        tbody.innerHTML = '<tr><td colspan="9">Failed to load orders.</td></tr>';
        message.textContent = error.message;
      }
    }

    // Update order status (Delivered or Spam)
    async function updateStatus(orderId, action) {
      const message = document.getElementById('message');
      message.textContent = ''; // Clear previous messages

      try {
        const response = await fetch(`/api/orders/${orderId}/${action}`, { method: 'PUT' });
        if (!response.ok) throw new Error('Failed to update order status.');

        // Refresh the orders table
        fetchOrders();
      } catch (error) {
        message.textContent = error.message;
      }
    }

    // Fetch orders when the page loads
    window.onload = fetchOrders;
  </script>
</body>
</html>
