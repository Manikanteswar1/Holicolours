<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holi Colours</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff6f61, #ffcc00, #00cc99, #3399ff, #cc33ff);
      background-size: cover;
      background-attachment: fixed;
      color: white;
      text-align: center;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: rgba(0, 0, 0, 0.7);
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      max-width: 400px;
      width: 90%;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      background: #ff6f61;
      color: white;
      padding: 10px 20px;
      border: none;
      margin-top: 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #ff4a3d;
    }

    #message {
      margin-top: 10px;
      font-weight: bold;
    }

    .delivery-text {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .contact-note {
      font-size: 14px;
      font-weight: bold;
      color: rgb(255, 255, 255);
      margin-top: 10px;
    }

    /* Footer Styles */
    footer {
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 10px;
      width: 90%;
      max-width: 300px;
      font-size: 12px;
      margin: 20px auto;
    }

    footer a {
      color: #ff6f61;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Mobile Responsiveness */
    @media (max-width: 480px) {
      h1 {
        font-size: 24px;
      }

      .delivery-text {
        font-size: 16px;
      }

      .container {
        padding: 15px;
      }

      input, select {
        padding: 8px;
        font-size: 14px;
      }

      button {
        padding: 8px 16px;
        font-size: 14px;
      }

      footer {
        font-size: 12px;
        margin-bottom: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <p class="delivery-text">Comfortable Door Delivery</p>
      <h1>Holi 1/2kg 5-Colour Combo @129Rs/- </h1>
      <form id="bookingForm">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="tel" id="phone" placeholder="Your Phone Number" pattern="[0-9]{10}" title="Enter a 10-digit phone number" required>
        <input type="text" id="address" placeholder="Block & Room No (ex: VE-101)" required>
        <select id="quantity" required>
          <option value="" disabled selected>Select Quantity</option>
          <option value="1">1 Combo</option>
          <option value="2">2 Combos</option>
          <option value="3">3 Combos</option>
          <option value="4">4 Combos</option>
          <option value="5">5 Combos</option>
        </select>
        <button type="submit">Book Now</button>
      </form>
      <p id="message"></p>
    </div>

    <!-- Contact Note Below Container -->
    <p class="contact-note">If you are unable to place an order, contact <strong>9989668368</strong>.</p>
  </div>

  <!-- Footer -->
  <footer>
    <p>Developed by <a>Mani</a> | &copy; 2025 All rights reserved.</p>
  </footer>

  <script>
    function displayMessage(message, isError = false) {
      const messageElement = document.getElementById('message');
      messageElement.textContent = message;
      messageElement.style.color = isError ? '#ff4a3d' : '#00cc99';
      setTimeout(() => messageElement.textContent = '', 30000);
    }

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const order = {
        name: document.getElementById('name').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim(),
        quantity: document.getElementById('quantity').value,
        orderDate: new Date().toISOString(), // Format compatible with MongoDB
      };

      try {
        const response = await fetch('/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(order),
        });

        const result = await response.json();
        if (response.ok) {
          displayMessage(result.message);
          document.getElementById('bookingForm').reset();
        } else {
          displayMessage(result.error || 'Something went wrong.', true);
        }
      } catch (error) {
        displayMessage('Network error. Please try again.', true);
        console.error('Error:', error);
      }
    });
  </script>
</body>
</html>
